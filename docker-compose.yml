  #     postgres:
  #       condition: service_healthy
  #   volumes:
  #     - ./backend:/app
  #     - ./data:/data
  #     - ./models:/models

  # Frontend service (to be configured after implementation)
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: potato_inspection_dashboard
  #   environment:
  #     NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - backend
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules

volumes:
  postgres_data:
  pgadmin_data:

networks:
  default:
    name: potato_inspection_network
