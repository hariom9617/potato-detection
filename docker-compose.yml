version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: potato_inspection_db
    environment:
      POSTGRES_USER: potato_user
      POSTGRES_PASSWORD: potato_dev_password
      POSTGRES_DB: potato_inspection_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U potato_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: potato_inspection_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@potato-inspection.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # Backend service (to be configured after implementation)
