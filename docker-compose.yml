  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: potato_inspection_api
  #   environment:
  #     DATABASE_URL: postgresql://potato_user:potato_dev_password@postgres:5432/potato_inspection_dev
  #     API_HOST: 0.0.0.0
  #     API_PORT: 8000
  #   ports:
  #     - "8000:8000"
